<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciar Conta | Rewalker</title>
  <link rel="stylesheet" href="../Styles/GerenciarConta.css" />
  <link rel="icon" type="image/png" href="../../Assets/Logos/rewalker_favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../Styles/alterar_senha.css" />
</head>
<body>
  <main class="account-container">
    <h1>Gerenciar Conta</h1>

    <div class="profile-section">
      <img src="../../Assets/Icons/perfilIcon.png" alt="Foto de Perfil" class="profile-pic">
      <button class="edit-photo-btn">Alterar Foto</button>
    </div>

    <div class="info-section">
      <div class="info-item">
        <span class="label">Nome:</span>
        <span id="user-name">Nome do Usuario</span>
        <button class="edit-btn" onclick="editarCampo('nome')">Editar</button>
      </div>

      <div class="info-item">
        <span class="label">Email:</span>
        <span id="user-email">email@do.usuario</span>
        <button class="edit-btn" onclick="editarCampo('email')">Editar</button>
      </div>

      <div class="info-item">
        <span class="label">Senha:</span>
        <span>********</span>
        <button class="edit-btn" onclick="openChangePasswordModal()">Alterar Senha</button>
      </div>
    </div>
  </main>
  <div id="modal-container"></div>
  <script src="../JavaScript/GerenciarConta.js"></script>
</body>
</html>
