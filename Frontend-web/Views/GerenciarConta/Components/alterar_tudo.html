<div id="edit-account-modal" class="modal">
  <div class="modal-content">
    <span id="close-edit-account" class="close-btn">&times;</span>
    <h2>Editar Conta</h2>
    <form id="edit-account-form">
      <label for="edit-nome">Nome:</label>
      <input type="text" id="edit-nome" required>

      <label for="edit-email">Email:</label>
      <input type="email" id="edit-email" required>

      <label for="edit-senha">Nova Senha:</label>
      <div class="password-container">
        <input type="password" id="edit-senha" required placeholder="Digite a nova senha">
        <span class="toggle-password" onclick="togglePasswordVisibility('edit-senha')">👁️</span>
      </div>

      <button type="submit">Salvar Alterações</button>
    </form>
  </div>
</div>

<style>
  .modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.7);
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: #1f1f25;
    padding: 2rem;
    border-radius: 12px;
    max-width: 460px;
    width: 90%;
    color: white;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    animation: fadeScaleIn 0.3s ease forwards;
    transform-origin: center;
  }

  .modal-content h2 {
    text-align: center;
    margin-bottom: 1rem;
    font-size: 1.7rem;
    color: #2c88ff;
  }

  .modal-content form {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    align-items: stretch;
  }

  .modal-content label {
    font-weight: 600;
    margin-bottom: 0.3rem;
    color: #aaa;
  }

  .modal-content input {
    width: 100%;
    padding: 0.8rem 1rem;
    font-size: 1rem;
    border-radius: 6px;
    border: none;
    background-color: #2c2c38;
    color: white;
    box-sizing: border-box;
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
  }

  .modal-content input::placeholder {
    color: #888;
    font-size: 0.95rem;
  }

  .modal-content input:focus {
    outline: none;
    background-color: #3a3a50;
    box-shadow: 0 0 6px #2c88ff;
  }

  .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #aaa;
    font-size: 1.3rem;
    user-select: none;
  }

  .toggle-password:hover {
    color: #fff;
  }

  .password-container {
    position: relative;
  }

  .modal-content button[type="submit"] {
    margin-top: 1.8rem;
    padding: 0.9rem 1.8rem;
    font-size: 1.1rem;
    background-color: transparent;
    border: 1.8px solid #2c88ff;
    color: #2c88ff;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.3s ease;
    width: 100%;
    max-width: 260px;
    align-self: center;
    text-align: center;
  }

  .modal-content button[type="submit"]:hover {
    background-color: #1b6ed6;
    color: white;
  }

  .close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 1.6rem;
    color: #aaa;
    cursor: pointer;
  }

  .close-btn:hover {
    color: #fff;
  }

  @keyframes fadeScaleIn {
    0% {
      opacity: 0;
      transform: scale(0.95);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }
</style>

<script>
  function togglePasswordVisibility(inputId) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
      input.type = "text";
    } else {
      input.type = "password";
    }
  }
</script>
