<div class="modal" id="register-modal">
    <div class="modal-content">
      <span class="close-btn" id="close-register">&times;</span>
      <h2>Criar Conta</h2>
      <form>
        <label for="register-name">Nome</label>
        <input type="text" id="register-name" name="name" required placeholder="👤Digite seu nome completo">
  
        <label for="register-email">Email</label>
        <input type="email" id="register-email" name="email" required placeholder="📧Digite seu email">
  
        <label for="register-password">Senha</label>
        <div class="password-container">
        <input type="password" id="register-password" name="password" required minlength="8" placeholder="🔒 Crie uma senha">
        <span class="toggle-password" id="toggle-register-password">&#128065;</span>
        </div>

        <label for="confirm-password">Confirmar Senha</label>
        <div class="password-container">
        <input type="password" id="confirm-password" name="confirm-password" required minlength="8" placeholder="🔒 Confirme a senha">
        <span class="toggle-password" id="toggle-confirm-password">&#128065;</span>
        </div>
        <button type="submit">Cadastrar</button>

        <div class="separator">
        <span>ou</span>
        </div>

        <button type="button" class="back-to-login-btn">Voltar ao login</button>

      </form>
    </div>
  </div>
