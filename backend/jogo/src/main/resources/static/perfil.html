<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="perfil-container">
        <h1>Perfil do Usuário</h1>

        <div class="perfil-info">
            <p><strong>Nome:</strong> <span id="nomeUsuario"></span></p>
            <p><strong>Email:</strong> <span id="emailUsuario"></span></p>
            <p><strong>Moedas Permanentes:</strong> <span id="moedasPermanentes"></span></p>
            <p><strong>Moedas Temporárias:</strong> <span id="moedasTemporarias"></span></p>
            <p><strong>Total de Cliques:</strong> <span id="totalCliques"></span></p>
            <p><strong>Inimigos Derrotados:</strong> <span id="inimigosDerrotados"></span></p>
        </div>

        <button id="editarPerfil">Editar Perfil</button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
