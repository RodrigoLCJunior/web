<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Redefinir Senha</title>
  <link rel="stylesheet" href="/Views/LandingPage/Styles/redefinir.css">
  <script src="/Views/LandingPage/JavaScript/redefi_senha.js" defer></script>
</head>
<body>
  <div class="container">
    <h2>Redefinir Senha</h2>
    <form id="reset-form">
      <label for="nova-senha">Nova Senha:</label>
      <input type="password" id="nova-senha" name="nova-senha" required placeholder="Digite sua nova senha" />

      <label for="confirmar-senha">Confirmar Senha:</label>
      <input type="password" id="confirmar-senha" name="confirmar-senha" required placeholder="Confirme sua nova senha" />

      <button type="submit">Redefinir Senha</button>
    </form>
  </div>
</body>
</html>
