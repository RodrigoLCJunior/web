<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir Senha</title>
  <link rel="stylesheet" href="../../LandingPage/Styles/recuperar.css" />
  <script src="../../LandingPage/JavaScript/recuperar.js" defer></script>
</head>
<body>
  <div class="modal" id="forgot-password-modal">
    <div class="modal-content">
      <span class="close-btn" id="close-forgot-modal">&times;</span>

      <h2>Redefinir Senha</h2>
      <form id="forgot-password-form">
        <label for="recovery-email">Email cadastrado</label>
        <input 
          type="email" 
          id="recovery-email" 
          name="recovery-email" 
          required 
          placeholder="📧 Digite seu email"
        >
        <button type="submit">Continuar</button>
      </form>
    </div>
  </div>
</body>
</html>
