      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" viewBox="0 0 24 24">

  <main class="account-container">
    <h1>Perfil do Usuário</h1>

    <div class="profile-section">
      <img src="../../../Assets/Icons/perfilIcon.png" alt="Foto de Perfil" class="profile-pic">
    </div>

    <div class="info-section">
      <div class="info-item">
        <span class="label">Nome:</span>
        <span id="user-name">Carregando...</span>
      </div>

      <div class="info-item">
        <span class="label">Email:</span>
        <span id="user-email">Carregando...</span>
      </div>

    </div>

    <div class="info-section">
      <h2>Avatar</h2>
      <div class="info-item">
        <span class="label">HP:</span>
        <span id="user-avatar">Carregando...</span>
      </div>
    </div>

    <div class="info-section">
      <h2>Progressão</h2>
      <div class="info-item">
        <span class="label">Moedas Temporárias:</span>
        <span id="moedas-temporarias">Carregando...</span>
      </div>
      <div class="info-item">
        <span class="label">Total de Cliques:</span>
        <span id="total-cliques">Carregando...</span>
      </div>
      <div class="info-item">
        <span class="label">Inimigos Derrotados:</span>
        <span id="inimigos-derrotados">Carregando...</span>
      </div>
    </div>

    <div class="info-section">
      <h2>Moeda Permanente</h2>
      <div class="info-item">
        <span class="label">Quantidade:</span>
        <span id="moeda-permanente">Carregando...</span>
      </div>
    </div>

    
      </div>
    </div>

    
  </main>

  <script type="module" src="../../../Controllers/Perfil.js"></script>

</html>
