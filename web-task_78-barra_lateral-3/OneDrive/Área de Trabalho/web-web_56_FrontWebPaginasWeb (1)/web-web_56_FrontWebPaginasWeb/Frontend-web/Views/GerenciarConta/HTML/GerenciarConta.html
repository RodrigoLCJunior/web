<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciar Conta | Rewalker</title>
  <link rel="stylesheet" href="../Styles/GerenciarConta.css" />
  <link rel="stylesheet" href="../Styles/alterar_senha.css" />
  <link rel="icon" type="image/png" href="../../../Assets/Logos/rewalker_favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>


<body>
<!-- barra lateral -->
  <nav class="menu-lateral"> 
  
      <div class="btn-expandir">
      <i class="bi bi-list"></i>
      </div>
       
      <ul>
        <li class="item-menu">
          <a href="">
              <span class="icon"><i class="bi bi-person"></i> </span>
              <span class="txt-link">Perfil</span>
          </a>

        </li>
        <li class="item-menu">
          <a href="">
              <span class="icon"> <i class="bi bi-gear"></i></span>
              <span class="txt-link">Configurações</span>
          </a>

        </li>
        <li class="item-menu">
          <a href="">
              <span class="icon"> <i class="bi bi-pen"></i></span>
              <span class="txt-link">Alterar</span>
          </a>

        </li>
        <li class="item-menu">
          <a href="">
              <span class="icon"> <i class="bi bi-box-arrow-left"></i></span>
              <span class="txt-link">Sair</span>
          </a>

        </li>
      </ul>

    </nav>


<!-- fim -->

  <main class="account-container">
    <h1>Gerenciar Conta</h1>

    <div class="profile-section">
      <img src="../../../Assets/Icons/perfilIcon.png" alt="Foto de Perfil" class="profile-pic">
      <button class="edit-photo-btn">Alterar Foto</button>
    </div>

    <div class="info-section">
      <div class="info-item">
        <span class="label">Nome:</span>
        <span id="user-name">Carregando...</span>
        <button class="edit-btn" id="edit-name-btn">Editar</button> <!-- Adicionei id -->
      </div>

      <div class="info-item">
        <span class="label">Email:</span>
        <span id="user-email">Carregando...</span>
        <button class="edit-btn" id="edit-email-btn">Editar</button> <!-- Adicionei id -->
      </div>

      <div class="info-item">
        <span class="label">Senha:</span>
        <span>********</span>
        <button class="edit-btn" id="change-password-btn">Alterar Senha</button> <!-- Adicionei id -->
      </div>

      <div class="info-item">
        <button id="logout-btn" class="logout-btn">Sair da Conta</button>
      </div>

      <div class="info-item">
        <button id="delete-account-btn" class="delete-btn">Excluir Conta</button>
      </div>
    </div>
  </main>

  <div id="modal-container"></div>

  <script type="module" src="../../../Controllers/GerenciarConta.js"></script>
</body>
</html>
